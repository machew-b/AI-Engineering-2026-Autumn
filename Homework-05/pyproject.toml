[project]
name = "aie2026-homework-05"
version = "0.1.0"
description = "AIE2026 Homework 5 (Advanced): Graph v2 retrieval over the lecture materials"
readme = "README.md"
requires-python = ">=3.12"
# Same pins as the course repo (without the MCP extra, which Homework 5 does not use)
dependencies = [
    "google-genai==2.31.0",
    "pydantic-ai-slim[google]==2.57.0",
    "sqlite-vec==0.1.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pydantic_graph"]
